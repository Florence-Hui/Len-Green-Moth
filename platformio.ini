[env:xiaoblesense]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git
board = xiaoblesense
framework = arduino
; Select the Nordic SDK-based Arduino core
board_build.core = arduino
monitor_speed = 115200
lib_deps = 
    arduino-libraries/ArduinoBLE@1.3.7
    arduino-libraries/Servo
upload_port = /dev/ttyACM0